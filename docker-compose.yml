services:
  familyplates:
    image: ghcr.io/elevate08/familyplates:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: familyplates
    restart: unless-stopped
    # With forward-auth and a reverse proxy on this host, publish as
    # "127.0.0.1:3000:80" instead (see docs/getting-started.md).
    ports:
      - "3000:80"
    environment: &environment
      - RAILS_ENV=production
      # No default on purpose. A fallback here would be a published constant, and
      # secret_key_base signs the session cookie that carries who you are signed
      # in as - a known value lets anyone mint an organizer session.
      # Generate one with: openssl rand -hex 64
      - "SECRET_KEY_BASE=${SECRET_KEY_BASE:?required - generate one with openssl rand -hex 64}"
      # Encrypts the Google service account key at rest. Optional - Google
      # Calendar sync is the only feature that needs it - but once set they must
      # not change, or stored credentials become unreadable. Deliberately
      # separate from SECRET_KEY_BASE so rotating that does not destroy them.
      # Generate each with: openssl rand -hex 32
      - "ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:-}"
      - "ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:-}"
      - RAILS_SERVE_STATIC_FILES=true
      - RAILS_LOG_TO_STDOUT=true
    volumes:
      - familyplates_data:/rails/storage
    # The worker waits for this, because starting the web container is what
    # prepares and migrates the databases.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Runs every background job, recipe imports included. An import fetches a
  # page from a stranger's server, and a hostile page can send an endless
  # response header that the HTTP client buffers in memory until the fetch
  # deadline (SA-12), so jobs run here, where a memory cap stops a runaway
  # fetch without taking down the web container. Same image, storage and
  # settings as above; it takes no web traffic. The web container prepares
  # the databases, so the worker never does.
  worker:
    image: ghcr.io/elevate08/familyplates:latest
    container_name: familyplates-worker
    command: ["./bin/jobs"]
    restart: unless-stopped
    depends_on:
      familyplates:
        condition: service_healthy
    environment: *environment
    volumes:
      - familyplates_data:/rails/storage
    # memswap_limit equal to mem_limit leaves no swap to absorb a runaway fetch.
    mem_limit: 512m
    memswap_limit: 512m

volumes:
  familyplates_data:
    driver: local
