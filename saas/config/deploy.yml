# Deploys the hosted FamilyPlates service with Kamal. Appliances do not use
# this: they run the published appliance image with Docker Compose.
#
# Two destinations, each a separate service with its own image, host, volume,
# Stripe account mode, SMTP account and secrets:
#
#   bin/kamal setup -d staging        # first deploy to a new server
#   bin/kamal deploy -d staging       # dev.familyplates.org, Stripe test mode
#   bin/kamal deploy -d production    # familyplates.org, Stripe live mode
#   bin/kamal rollback <version> -d production
#
# This file holds only what both share. deploy.production.yml and
# deploy.staging.yml add the rest, and Kamal reads saas/.kamal/secrets.production
# or saas/.kamal/secrets.staging for the destination given. Each destination
# reads only deployer variables named for it (FAMILYPLATES_PRODUCTION_*,
# FAMILYPLATES_STAGING_*); no .env file is loaded.

# There is no default target: a deploy names the one it means.
require_destination: true

# A registry on the server, reached over SSH, so the image is never published.
registry:
  server: localhost:5555

# Built at deploy time from the committed code, as the hosted edition.
builder:
  arch: amd64
  args:
    EDITION: hosted

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

asset_path: /rails/public/assets

secrets_path: saas/.kamal/secrets
hooks_path: saas/.kamal/hooks
