# created_at is explicit because the appliance's household is resolved as the
# oldest one (Household.installation). Fixture ids are hashes of the label, not
# insertion order - without these timestamps "the first household" came out as
# the Miller Family, which is the arbitrariness that resolver exists to remove.
one:
  name: "Spencer Family"
  join_code: "TEST-ONE0-CODE"
  calendar_feed_token: "test_feed_token_one"
  onboarded_at: <%= 2.years.ago %>
  google_calendar_enabled: false
  created_at: <%= 2.years.ago %>

# Only ever the *other* household. Nothing outside the cross-tenant suite should
# depend on it existing.
two:
  name: "Miller Family"
  join_code: "TEST-TWO0-CODE"
  calendar_feed_token: "test_feed_token_two"
  onboarded_at: <%= 1.year.ago %>
  google_calendar_enabled: false
  created_at: <%= 1.year.ago %>
