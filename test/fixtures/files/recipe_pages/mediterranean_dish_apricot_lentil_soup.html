Lentil Soup is velvety, gently sweet, and perfectly balanced with warm spices and bright lemon.","datePublished":"2025-12-12T08:00:00+00:00","image":["https:\/\/www.themediterraneandish.com\/wp-content\/uploads\/2025\/12\/TMD-Armenian-Apricot-Soup-Leads-04-Overhead.jpg","https:\/\/www.themediterraneandish.com\/wp-content\/uploads\/2025\/12\/TMD-Armenian-Apricot-Soup-Leads-04-Overhead-500x500.jpg","https:\/\/www.themediterraneandish.com\/wp-content\/uploads\/2025\/12\/TMD-Armenian-Apricot-Soup-Leads-04-Overhead-500x375.jpg","https:\/\/www.themediterraneandish.com\/wp-content\/uploads\/2025\/12\/TMD-Armenian-Apricot-Soup-Leads-04-Overhead-480x270.jpg"],"recipeYield":["6"],"prepTime":"PT10M","cookTime":"PT30M","totalTime":"PT40M","recipeIngredient":["1 cup dried apricots (, roughly chopped; or 2 large, ripe apricots, pitted and roughly chopped, plus more to serve)","2 tablespoons extra virgin olive oil, (plus more to serve)","1  small yellow onion, (finely chopped)","3  large carrots, (peeled and finely chopped)","Kosher salt","Freshly ground black pepper","1 cup grape tomatoes, (halved (about 14 tomatoes))","2 tablespoons tomato paste","2  medium garlic cloves,  (crushed)","1 teaspoon ground cumin","1\/2 teaspoon sweet paprika","2 tablespoons water","5 cups chicken stock, (homemade or store-bought, or vegetable broth, plus more if needed)","2 cups red lentils (rinsed and drained)","1  lemon, (juiced (about 1\/4 cup))","1\/4 cup roughly chopped fresh flat-leaf parsley"],"recipeInstructions":[{"@type":"HowToStep","text":"Prep the apricots. In a small bowl, add the chopped dried apricots and cover with warm water by about 1 inch. Set aside to plump and soften while you work on the rest of the soup. (If using fresh apricots, skip this step.)","name":"Prep the apricots. In a small bowl, add the chopped dried apricots and cover with warm water by about 1 inch. Set aside to plump and soften while you work on the rest of the soup. (If using fresh apricots, skip this step.)","url":"https:\/\/www.themediterraneandish.com\/armenian-apricot-red-lentil-soup\/#wprm-recipe-123483-step-0-0"},{"@type":"HowToStep","text":"Sauté the vegetables. In a large Dutch oven or heavy-bottomed pot set over medium-high heat, add the olive oil. Once the oil begins to shimmer, add the onion and carrots and season with a big pinch of salt and black pepper (about 1\/2 teaspoon each). Cook, stirring occasionally, until the vegetables are soft, about 8 minutes.","name":"Sauté the vegetables. In a large Dutch oven or heavy-bottomed pot set over medium-high heat, add the olive oil. Once the oil begins to shimmer, add the onion and carrots and season with a big pinch of salt and black pepper (about 1\/2 teaspoon each). Cook, stirring occasionally, until the vegetables are soft, about 8 minutes.","url":"https:\/\/www.themediterraneandish.com\/armenian-apricot-red-lentil-soup\/#wprm-recipe-123483-step-0-1"},{"@type":"HowToStep","text":"Add the tomatoes and spices. Add the grape tomatoes, tomato paste, garlic, cumin, paprika, and the water. Mix and cook for 1 more minute.","name":"Add the tomatoes and spices. Add the grape tomatoes, tomato paste, garlic, cumin, paprika, and the water. Mix and cook for 1 more minute.","url":"https:\/\/www.themediterraneandish.com\/armenian-apricot-red-lentil-soup\/#wprm-recipe-123483-step-0-2"},{"@type":"HowToStep","text":"Simmer the soup. Stir in the stock and the lentils. Season with another big pinch of salt and black pepper (about 1\/2 teaspoon each). Bring the liquid to a boil, then reduce the heat to low and partially cover the pot. Simmer for about 20 minutes, or until the lentils are very tender and begin to break down; stir the soup occasionally. If it gets too thick, stir in about 1\/2 cup stock or more water to reach your desired thickness; I like mine on the thicker side—more like stew.","name":"Simmer the soup. Stir in the stock and the lentils. Season with another big pinch of salt and black pepper (about 1\/2 teaspoon each). Bring the liquid to a boil, then reduce the heat to low and partially cover the pot. Simmer for about 20 minutes, or until the lentils are very tender and begin to break down; stir the soup occasionally. If it gets too thick, stir in about 1\/2 cup stock or more water to reach your desired thickness; I like mine on the thicker side—more like stew.","url":"https:\/\/www.themediterraneandish.com\/armenian-apricot-red-lentil-soup\/#wprm-recipe-123483-step-0-3"},{"@type":"HowToStep","text":"Purée the soup. Remove the pot from the heat. Drain the chopped apricots and stir them into the soup along with the lemon juice. Using an immersion blender, carefully puree the soup to your desired smoothness. (I like mine with a little bit of texture, but some people prefer it smooth. It’s really up to you.) Taste and adjust the salt to your liking.","name":"Purée the soup. Remove the pot from the heat. Drain the chopped apricots and stir them into the soup along with the lemon juice. Using an immersion blender, carefully puree the soup to your desired smoothness. (I like mine with a little bit of texture, but some people prefer it smooth. It’s really up to you.) Taste and adjust the salt to your liking.","url":"https:\/\/www.themediterraneandish.com\/armenian-apricot-red-lentil-soup\/#wprm-recipe-123483-step-0-4"},{"@type":"HowToStep","text":"Finish and serve. Ladle the soup into serving bowls and finish each with a generous drizzle of olive oil and a sprinkle of fresh parsley. Add some additional chopped apricots, either fresh or dried, if you like.","name":"Finish and serve. Ladle the soup into serving bowls and finish each with a generous drizzle of olive oil and a sprinkle of fresh parsley. Add some additional chopped apricots, either fresh or dried, if you like.","url":"https:\/\/www.themediterraneandish.com\/armenian-apricot-red-lentil-soup\/#wprm-recipe-123483-step-0-5"}],"aggregateRating":{"@type":"AggregateRating","ratingValue":"5","ratingCount":"11","reviewCount":"10"},"review":[{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"I was looking for a healthy, delicious and easy to cook red lentil recipe. Once again your website provided just what I was looking for. Thank you! Perfect match.","author":{"@type":"Person","name":"Elena Nugmanova"},"datePublished":"2026-03-21"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"This was terrific, the apricots gave every spoonful the perfect amount of sweetness. Amazing blend of flavors and perfect for a cold weeknight.","author":{"@type":"Person","name":"Rich B"},"datePublished":"2026-02-22"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"I blended it, don't think it would be as good without that step.","author":{"@type":"Person","name":"Rich B"},"datePublished":"2026-02-22"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"A beautiful soup with subtle flavors that bring it to a comfortable, nourishing, calm eating experience. Thank you.","author":{"@type":"Person","name":"Linda Hicks"},"datePublished":"2026-02-01"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"I brought this soup to a New Years Eve gathering, and it was a hit!  \r\nI completely forgot the parsley, which would have added a welcome bit of color and flavor; used vegetable broth, not chicken or chicken-flavored.  Instead of discarding the water from the soaking dried apricots, I added it along with them, and also the water from the extra apricots that we used as a topping.  That liquid was very welcome, and I also added an extra drizzle of olive oil.  Did not blend any of it, as it was already pretty thick, and I didn't want the extra effort.  \r\nOh, we ran out of pepper, so I used extra paprika.\r\nNext time I'll remember the parsley.","author":{"@type":"Person","name":"Norm Green"},"datePublished":"2026-01-01"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Stunning soup, freezes well (I added some buttnut squash as well as I had so.e that needed using up)","author":{"@type":"Person","name":"Rachel Jane Davis"},"datePublished":"2025-12-30"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"What a beautiful soup! Officially part of my monthly meal planning!","author":{"@type":"Person","name":"Laura"},"datePublished":"2025-12-29"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Hi, I made it today. It was so easy yet so tasty. We had a bowl of hot soup for supper. The only problem I get is the measurement units. I am not based in US and have to calculate everything to grams or ml. Maybe it is worth considering adding also European metrics next to each ingredient on the  list since it it the Mediterranean diet? Just wondering...","author":{"@type":"Person","name":"Paulina"},"datePublished":"2025-12-27"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Delicious!!  So yummy!!","author":{"@type":"Person","name":"Nancy Loskill"},"datePublished":"2025-12-21"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Loved the flavor and the color as well.","author":{"@type":"Person","name":"NH"},"datePublished":"2025-12-19"}],"recipeCategory":["Soup"],"recipeCuisine":["Armenian"],"suitableForDiet":["https:\/\/schema.org\/GlutenFreeDiet","https:\/\/schema.org\/VeganDiet","https:\/\/schema.org\/VegetarianDiet"],"keywords":"carrot, carrots, dried apricots, easy lentil soup, lentils, onion, red lentils, spices","nutrition":{"@type":"NutritionInformation","calories":"374.7 kcal","carbohydrateContent":"61 g","proteinContent":"21.5 g","fatContent":"6.9 g","saturatedFatContent":"1.1 g","sodiumContent":"132.9 mg","fiberContent":"22.3 g","sugarContent":"17.1 g","unsaturatedFatContent":"5.4 g","servingSize":"1 serving"},"@id":"https:\/\/www.themediterraneandish.com\/armenian-apricot-red-lentil-soup\/#recipe","isPartOf":{"@id":"https:\/\/www.themediterraneandish.com\/armenian-apricot-red-lentil-soup\/#article"},"mainEntityOfPage":"https:\/\/www.themediterraneandish.com\/armenian-apricot-red-lentil-soup\/"}]}</script>
