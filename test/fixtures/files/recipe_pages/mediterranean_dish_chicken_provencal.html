alOccupationalCredential","credentialCategory":"award","name":"New York Times Bestselling Author"},"author":[{"@type":"Book","name":"The Mediterranean Dish: 120 Bold and Healthy Recipes You'll Make on Repeat","author":{"@type":"Person","@id":"https:\/\/www.themediterraneandish.com\/#founder"},"publisher":{"@type":"Organization","name":"Clarkson Potter"},"bookFormat":"https:\/\/schema.org\/Hardcover"},{"@type":"Book","name":"The Mediterranean Dish: Simply Dinner: 125 Easy Mediterranean Diet-Inspired Recipes to Eat Well and Live Joyfully","author":{"@type":"Person","@id":"https:\/\/www.themediterraneandish.com\/#founder"},"publisher":{"@type":"Organization","name":"Clarkson Potter"},"bookFormat":"https:\/\/schema.org\/Hardcover"}]},"address":{"@type":"PostalAddress","postOfficeBoxNumber":"1387","addressLocality":"Alpharetta","addressRegion":"GA","postalCode":"30009","addressCountry":"US"},"contactPoint":{"@type":"ContactPoint","email":"sales@themediterraneandish.com","contactType":"customer service"},"subOrganization":{"@type":"Organization","@id":"https:\/\/shop.themediterraneandish.com\/#organization","name":"The Mediterranean Dish Shop","url":"https:\/\/shop.themediterraneandish.com"}},{"@type":"Person","@id":"https:\/\/www.themediterraneandish.com\/#\/schema\/person\/c75230ad1bab6267284fd93705204e58","name":"Abigail Chipley","image":{"@type":"ImageObject","inLanguage":"en-US","@id":"https:\/\/www.themediterraneandish.com\/wp-content\/uploads\/2024\/02\/cropped-Abigail-Headshot-1-96x96.jpg","url":"https:\/\/www.themediterraneandish.com\/wp-content\/uploads\/2024\/02\/cropped-Abigail-Headshot-1-96x96.jpg","contentUrl":"https:\/\/www.themediterraneandish.com\/wp-content\/uploads\/2024\/02\/cropped-Abigail-Headshot-1-96x96.jpg","caption":"Abigail Chipley"},"description":"Abigail is a trained chef and writer whose work has appeared in Martha Stewart’s Everyday Food, Real Simple, Vegetarian Times, and Foodnetwork.com. She has also contributed to cookbooks, including Martha Stewart’s Baking Handbook, Everyday Food: Great Food Fast, and Real Simple’s Easy, Delicious Home Cooking: 250 Recipes for Every Season and Occasion.","url":"https:\/\/www.themediterraneandish.com\/author\/abigail-chipley\/","sameAs":[]},{"@type":"Recipe","name":"Chicken Provencal","author":{"@id":"https:\/\/www.themediterraneandish.com\/#\/schema\/person\/c75230ad1bab6267284fd93705204e58"},"description":"This chicken Provencal recipe uses bone-in thighs braised in an aromatic white wine sauce made with tarragon, orange, cherry tomatoes, olives, and capers. The bonus to this method is that the skin stays nice and crispy.","datePublished":"2025-11-05T09:59:40+00:00","image":["https:\/\/www.themediterraneandish.com\/wp-content\/uploads\/2025\/10\/TMD-Chicken-Provencal-Leads-01-Overhead-Horizontal.jpg","https:\/\/www.themediterraneandish.com\/wp-content\/uploads\/2025\/10\/TMD-Chicken-Provencal-Leads-01-Overhead-Horizontal-500x500.jpg","https:\/\/www.themediterraneandish.com\/wp-content\/uploads\/2025\/10\/TMD-Chicken-Provencal-Leads-01-Overhead-Horizontal-500x375.jpg","https:\/\/www.themediterraneandish.com\/wp-content\/uploads\/2025\/10\/TMD-Chicken-Provencal-Leads-01-Overhead-Horizontal-480x270.jpg"],"recipeYield":["8"],"prepTime":"PT30M","cookTime":"PT75M","totalTime":"PT105M","recipeIngredient":["3 pounds bone-in skin-on chicken thighs  ((about 8))","2 tablespoons Herbes de Provence","Kosher salt","Freshly ground black pepper","1 tablespoon extra virgin olive oil","6  medium shallots ((about 12 ounces), peeled and quartered)","12  garlic cloves, (peeled and halved lengthwise)","1 cup dry white wine","2 cups (10 ounces) cherry or grape tomatoes","1\/2 cup green olives (such as Castelvetrano, pitted and halved)","2 tablespoons capers, (rinsed well in cold water)","4  sprigs fresh tarragon","1  3-inch strip orange zest","Fresh flat-leaf parsley, (chopped)","Baguette (for serving (optional))"],"recipeInstructions":[{"@type":"HowToStep","text":"Get ready. Preheat your oven to 350°F.","name":"Get ready. Preheat your oven to 350°F.","url":"https:\/\/www.themediterraneandish.com\/chicken-provencal\/#wprm-recipe-120777-step-0-0"},{"@type":"HowToStep","text":"Season the chicken. Pat the chicken dry with paper towels. Combine Herbes de Provence with 1 1\/2 teaspoons salt and a generous amount of freshly ground black pepper. Rub the mixture between your fingers to crush the dried herbs and release their aroma. Then, rub the Herbes de Provence mixture on both sides, making sure to lift the skin up and rub some underneath. Set aside for 20 minutes, or refrigerate uncovered for 2 hours if you have the time.","name":"Season the chicken. Pat the chicken dry with paper towels. Combine Herbes de Provence with 1 1\/2 teaspoons salt and a generous amount of freshly ground black pepper. Rub the mixture between your fingers to crush the dried herbs and release their aroma. Then, rub the Herbes de Provence mixture on both sides, making sure to lift the skin up and rub some underneath. Set aside for 20 minutes, or refrigerate uncovered for 2 hours if you have the time.","url":"https:\/\/www.themediterraneandish.com\/chicken-provencal\/#wprm-recipe-120777-step-0-1"},{"@type":"HowToStep","text":"Sear the chicken. Heat olive oil in a large frying pan over medium heat. When the oil is shimmering, add half of the chicken, skin side down. Let the chicken cook undisturbed until the skin turns golden brown and releases from the pan, 8 to 10 minutes. Using tongs or a thin metal spatula, pry the chicken up and flip. Brown on the other side briefly, about 3 minutes. Transfer the chicken to a plate for now (you will cook it through later). Repeat with the remaining chicken. (There should be enough fat left in the pan from the previous batch, but add another tablespoon oil if needed.)","name":"Sear the chicken. Heat olive oil in a large frying pan over medium heat. When the oil is shimmering, add half of the chicken, skin side down. Let the chicken cook undisturbed until the skin turns golden brown and releases from the pan, 8 to 10 minutes. Using tongs or a thin metal spatula, pry the chicken up and flip. Brown on the other side briefly, about 3 minutes. Transfer the chicken to a plate for now (you will cook it through later). Repeat with the remaining chicken. (There should be enough fat left in the pan from the previous batch, but add another tablespoon oil if needed.)","url":"https:\/\/www.themediterraneandish.com\/chicken-provencal\/#wprm-recipe-120777-step-0-2"},{"@type":"HowToStep","text":"Add the aromatics and deglaze. Add the shallots and garlic to the pan. Cook briefly, stirring over medium heat until slightly softened and fragrant, about 3 minutes. Add the wine and continue cooking. Use a wooden spoon or spatula to loosen the browned bits from the bottom of the pan and cook until the wine has reduced by half, about 5 minutes.","name":"Add the aromatics and deglaze. Add the shallots and garlic to the pan. Cook briefly, stirring over medium heat until slightly softened and fragrant, about 3 minutes. Add the wine and continue cooking. Use a wooden spoon or spatula to loosen the browned bits from the bottom of the pan and cook until the wine has reduced by half, about 5 minutes.","url":"https:\/\/www.themediterraneandish.com\/chicken-provencal\/#wprm-recipe-120777-step-0-3"},{"@type":"HowToStep","text":"Add other elements. Stir in the tomatoes, olives, capers, 2 sprigs of tarragon, and one 3-inch strip of orange zest. Bring to a simmer.","name":"Add other elements. Stir in the tomatoes, olives, capers, 2 sprigs of tarragon, and one 3-inch strip of orange zest. Bring to a simmer.","url":"https:\/\/www.themediterraneandish.com\/chicken-provencal\/#wprm-recipe-120777-step-0-4"},{"@type":"HowToStep","text":"Braise the chicken. Carefully nestle chicken into the liquid, making sure the liquid only covers the bottoms of the chicken thighs and leaves the skins exposed (this will help the skin stay brown and crispy). Bring to a simmer. Transfer chicken to the oven and cook, uncovered, until the chicken is tender, the tomatoes have softened, and the liquid has reduced by about half, about 45 minutes.","name":"Braise the chicken. Carefully nestle chicken into the liquid, making sure the liquid only covers the bottoms of the chicken thighs and leaves the skins exposed (this will help the skin stay brown and crispy). Bring to a simmer. Transfer chicken to the oven and cook, uncovered, until the chicken is tender, the tomatoes have softened, and the liquid has reduced by about half, about 45 minutes.","url":"https:\/\/www.themediterraneandish.com\/chicken-provencal\/#wprm-recipe-120777-step-0-5"},{"@type":"HowToStep","text":"Finish and serve. Transfer the chicken thighs to a plate. Discard the tarragon sprigs and orange zest. Ladle the braised tomato sauce into shallow bowls, and top each serving with chicken pieces. Chop the remaining 2 tarragon sprigs and parsley and sprinkle over the chicken. Serve baguette on the side.","name":"Finish and serve. Transfer the chicken thighs to a plate. Discard the tarragon sprigs and orange zest. Ladle the braised tomato sauce into shallow bowls, and top each serving with chicken pieces. Chop the remaining 2 tarragon sprigs and parsley and sprinkle over the chicken. Serve baguette on the side.","url":"https:\/\/www.themediterraneandish.com\/chicken-provencal\/#wprm-recipe-120777-step-0-6"}],"aggregateRating":{"@type":"AggregateRating","ratingValue":"5","ratingCount":"2","reviewCount":"2"},"review":[{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"This is a lovely, easy to make chicken. I just used tarragon seasoning instead of fresh tarragon. When using chicken cutlets, it did not take 45 minutes to reduce the wine. This is tasty enough to serve guests.","author":{"@type":"Person","name":"Donna Smieth"},"datePublished":"2026-07-30"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Once I gathered up everything I needed, the recipe went quickly.\r\nI added sliced mushrooms that needed to be used up.\r\nMy husband kept saying Mmm, this is So good!\r\nIt was even better the next day with rice! Thank you, this will be in our chicken rotation!! 10\/5!! Yummy!!","author":{"@type":"Person","name":"Val"},"datePublished":"2025-11-15"}],"recipeCategory":["Dinner","Entree\/Poultry"],"recipeCuisine":["French\/Mediterranean"],"suitableForDiet":["https:\/\/schema.org\/GlutenFreeDiet","https:\/\/schema.org\/LowLactoseDiet"],"keywords":"Braised Chicken Thighs, capers, cherry tomatoes, green olives, orange, tarragon","nutrition":{"@type":"NutritionInformation","calories":"400.7 kcal","carbohydrateContent":"8.6 g","proteinContent":"24.9 g","fatContent":"27.3 g","saturatedFatContent":"6.9 g","transFatContent":"0.1 g","cholesterolContent":"141.7 mg","sodiumContent":"305.6 mg","fiberContent":"1.9 g","sugarContent":"2.9 g","unsaturatedFatContent":"17.6 g","servingSize":"1 serving"},"@id":"https:\/\/www.themediterraneandish.com\/chicken-provencal\/#recipe","isPartOf":{"@id":"https:\/\/www.themediterraneandish.com\/chicken-provencal\/#article"},"mainEntityOfPage":"https:\/\/www.themediterraneandish.com\/chicken-provencal\/"},{"@type":["Person"],"@id":"https:\/\/www.themediterraneandish.com\/#\/schema\/person\/a3169080f5b7356eb258ec57a76945c5","name":"Suzy Karadsheh","jobTitle":"Founder","url":"https:\/\/www.themediterraneandish.com\/author\/suzythemediterraneandish-com\/","description":"Founder and CEO of The Mediterranean Dish | Two-time New York Times Best Selling Cookbook Author | Specializing in Mediterranean Cuisine\r\n\r\nSuzy Karadsheh is a true daughter of the Mediterranean. She was born on the coast of Egypt in the bustling cosmopolitan city of Port Said, the North entrance of the Suez Canal, and just a boat ride away from places like Italy, Greece, Turkey, Lebanon, Palestine, and Israel.","image":{"@type":"ImageObject","@id":"https:\/\/www.themediterraneandish.com\/wp-content\/uploads\/2026\/01\/Suzy-headshot-96x96.jpg","url":"https:\/\/www.themediterraneandish.com\/wp-content\/uploads\/2026\/01\/Suzy-headshot-96x96.jpg","caption":"Suzy Karadsheh"}}]}</script>
