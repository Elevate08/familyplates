        aisle_category: "Produce"
      - name: "Olive Oil"
        quantity: 2
        unit: "tbsp"
        raw_text: "2 tbsp olive oil"
        aisle_category: "Pantry & Grains"
      - name: "Chili Powder"
        quantity: 1
        unit: "tbsp"
        raw_text: "1 tbsp chili powder"
        aisle_category: "Spices & Baking"
      - name: "Cumin"
        quantity: 1
        unit: "tsp"
        raw_text: "1 tsp ground cumin"
        aisle_category: "Spices & Baking"

  - id: "spaghetti-bolognese"
    title: "Classic Spaghetti Bolognese"
    description: "Rich, hearty meat sauce simmered with garlic, tomatoes, and herbs over tender pasta."
    prep_time: 15
    cook_time: 30
    servings: 4
    tags: ["Comfort Food", "Kid Friendly", "Pasta", "Italian"]
    image_url: "https://images.unsplash.com/photo-1622973536968-3ead9e780960?auto=format&fit=crop&w=800&q=80"
    instructions: |
      1. Heat olive oil in a large pot over medium-high heat. Add diced onion and minced garlic, sauté 3 minutes.
      2. Add ground beef, breaking it up until browned. Drain excess fat if needed.
      3. Stir in crushed tomatoes, tomato paste, Italian seasoning, salt, and black pepper. Simmer on low for 20 minutes.
      4. Meanwhile, cook spaghetti in boiling salted water until al dente. Drain.
      5. Toss pasta with sauce and top with grated parmesan cheese.
    ingredients:
      - name: "Ground Beef"
        quantity: 1
        unit: "lb"
        raw_text: "1 lb lean ground beef"
        aisle_category: "Meat & Seafood"
      - name: "Spaghetti"
        quantity: 1
        unit: "lb"
        raw_text: "1 lb dry spaghetti pasta"
        aisle_category: "Pantry & Grains"
      - name: "Crushed Tomatoes"
        quantity: 28
        unit: "oz"
        raw_text: "1 can (28 oz) crushed tomatoes"
        aisle_category: "Pantry & Grains"
      - name: "Tomato Paste"
        quantity: 2
        unit: "tbsp"
        raw_text: "2 tbsp tomato paste"
        aisle_category: "Pantry & Grains"
      - name: "Garlic"
        quantity: 4
        unit: "cloves"
        raw_text: "4 cloves garlic, minced"
        aisle_category: "Produce"
      - name: "Yellow Onion"
        quantity: 1
        unit: "count"
        raw_text: "1 yellow onion, finely diced"
        aisle_category: "Produce"
      - name: "Parmesan Cheese"
        quantity: 0.5
        unit: "cup"
        raw_text: "1/2 cup grated parmesan cheese"
        aisle_category: "Dairy & Refrigerated"

  - id: "crispy-tacos"
    title: "15-Minute Weeknight Beef Tacos"
    description: "Crispy taco shells loaded with seasoned beef, shredded lettuce, cheddar, and salsa."
    prep_time: 5
    cook_time: 10
    servings: 4
    tags: ["Quick (<30m)", "Kid Friendly", "Mexican"]
    image_url: "https://images.unsplash.com/photo-1565299585323-38d6b0865b47?auto=format&fit=crop&w=800&q=80"
    instructions: |
      1. Brown ground beef in a skillet over medium heat. Drain grease.
      2. Add taco seasoning and 1/3 cup water. Simmer for 3 minutes until thickened.
      3. Warm taco shells in the oven at 350°F for 5 minutes.
      4. Assemble tacos with meat, shredded cheddar, diced tomato, lettuce, and sour cream.
