        raw_text: "12 hard taco shells"
        aisle_category: "Pantry & Grains"
      - name: "Cheddar Cheese"
        quantity: 1.5
        unit: "cups"
        raw_text: "1.5 cups shredded cheddar cheese"
        aisle_category: "Dairy & Refrigerated"
      - name: "Shredded Lettuce"
        quantity: 2
        unit: "cups"
        raw_text: "2 cups shredded romaine lettuce"
        aisle_category: "Produce"
      - name: "Roma Tomatoes"
        quantity: 2
        unit: "count"
        raw_text: "2 roma tomatoes, diced"
        aisle_category: "Produce"
      - name: "Sour Cream"
        quantity: 0.5
        unit: "cup"
        raw_text: "1/2 cup sour cream"
        aisle_category: "Dairy & Refrigerated"

  - id: "salmon-and-veggies"
    title: "Garlic Butter Baked Salmon & Asparagus"
    description: "Flaky salmon fillets roasted with fresh asparagus, lemon juice, and rich melted garlic butter."
    prep_time: 10
    cook_time: 15
    servings: 4
    tags: ["Healthy", "Quick (<30m)", "Seafood"]
    image_url: "https://images.unsplash.com/photo-1467003909585-2f8a72700288?auto=format&fit=crop&w=800&q=80"
    instructions: |
      1. Preheat oven to 400°F (200°C). Line baking sheet with parchment paper.
      2. Place salmon fillets and trimmed asparagus spears on baking sheet.
      3. Whisk melted butter, minced garlic, lemon juice, salt, and pepper. Spoon generously over salmon and asparagus.
      4. Bake for 12-15 minutes until salmon flakes easily with a fork.
    ingredients:
      - name: "Salmon Fillets"
        quantity: 4
        unit: "fillets"
        raw_text: "4 salmon fillets (approx 6 oz each)"
        aisle_category: "Meat & Seafood"
      - name: "Asparagus"
        quantity: 1
        unit: "bunch"
        raw_text: "1 bunch fresh asparagus, woody ends trimmed"
        aisle_category: "Produce"
      - name: "Butter"
        quantity: 4
        unit: "tbsp"
        raw_text: "4 tbsp melted butter"
        aisle_category: "Dairy & Refrigerated"
      - name: "Garlic"
        quantity: 3
        unit: "cloves"
        raw_text: "3 cloves garlic, minced"
        aisle_category: "Produce"
      - name: "Lemon"
        quantity: 1
        unit: "count"
        raw_text: "1 fresh lemon, halved"
        aisle_category: "Produce"

  - id: "chicken-stir-fry"
    title: "Quick Chicken & Veggie Stir-Fry Noodles"
    description: "Savory stir-fried noodles with chicken, broccoli florets, and bell peppers in a quick soy-ginger glaze."
    prep_time: 15
    cook_time: 10
    servings: 4
    tags: ["Quick (<30m)", "Asian"]
    image_url: "https://images.unsplash.com/photo-1512058564366-18510be2db19?auto=format&fit=crop&w=800&q=80"
    instructions: |
      1. Cook ramen or lo mein noodles according to package, rinse with cold water and set aside.
      2. Whisk soy sauce, sesame oil, honey, minced garlic, and cornstarch with 3 tbsp water.
      3. Sear bite-sized chicken breast chunks in a hot skillet with oil for 5 minutes. Remove.
      4. Add broccoli florets and sliced peppers to same skillet; stir fry for 3-4 minutes until tender-crisp.
      5. Return chicken, noodles, and sauce to skillet. Toss continuously for 2 minutes until glossy and coated.
    ingredients:
      - name: "Chicken Breast"
        quantity: 1
        unit: "lb"
        raw_text: "1 lb boneless chicken breasts, bite-sized"
        aisle_category: "Meat & Seafood"
      - name: "Stir Fry Noodles"
        quantity: 10
        unit: "oz"
        raw_text: "10 oz fresh lo mein or ramen noodles"
        aisle_category: "Pantry & Grains"
      - name: "Broccoli"
        quantity: 2
        unit: "heads"
        raw_text: "2 small heads broccoli, cut into florets"
        aisle_category: "Produce"
      - name: "Soy Sauce"
        quantity: 4
        unit: "tbsp"
        raw_text: "4 tbsp low-sodium soy sauce"
        aisle_category: "Pantry & Grains"
      - name: "Sesame Oil"
        quantity: 1
        unit: "tbsp"
        raw_text: "1 tbsp toasted sesame oil"
        aisle_category: "Pantry & Grains"
      - name: "Honey"
        quantity: 2
        unit: "tbsp"
        raw_text: "2 tbsp honey"
        aisle_category: "Pantry & Grains"

  - id: "friday-pizza-night"
    title: "Homemade Friday Pizza Night"
    description: "Crispy crust loaded with bubbly mozzarella, rich marinara, and your favorite toppings."
    prep_time: 15
    cook_time: 15
    servings: 4
    tags: ["Kid Friendly", "Family Favorite", "Italian"]
    image_url: "https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=800&q=80"
    instructions: |
      1. Preheat oven to 475°F (245°C).
      2. Stretch prepared pizza dough onto a round pizza pan or baking sheet.
      3. Spread pizza sauce evenly, leaving a 1/2-inch border for crust.
      4. Top with shredded mozzarella and pepperoni slices.
      5. Bake for 12-15 minutes until cheese is bubbly and crust is golden brown.
    ingredients:
      - name: "Pizza Dough"
        quantity: 1
        unit: "lb"
        raw_text: "1 lb fresh prepared pizza dough"
        aisle_category: "Bakery"
      - name: "Pizza Sauce"
        quantity: 1
        unit: "cup"
        raw_text: "1 cup pizza sauce / marinara"
        aisle_category: "Pantry & Grains"
      - name: "Mozzarella Cheese"
        quantity: 2
        unit: "cups"
        raw_text: "2 cups shredded whole milk mozzarella"
        aisle_category: "Dairy & Refrigerated"
      - name: "Pepperoni"
        quantity: 4
        unit: "oz"
        raw_text: "4 oz sliced pepperoni"
        aisle_category: "Meat & Seafood"

  - id: "tomato-soup-grilled-cheese"
    title: "Creamy Tomato Soup & Sourdough Grilled Cheese"
    description: "Rich roasted tomato basil soup paired with golden buttery cheddar grilled cheese sandwiches."
    prep_time: 10
    cook_time: 20
    servings: 4
    tags: ["Comfort Food", "Quick (<30m)", "Vegetarian"]
    image_url: "https://images.unsplash.com/photo-1547592166-23ac45744acd?auto=format&fit=crop&w=800&q=80"
    instructions: |
      1. Sauté diced onion and garlic in butter in a medium pot. Add canned whole peeled tomatoes and vegetable broth.
      2. Simmer for 15 minutes. Puree with immersion blender until smooth. Stir in heavy cream and fresh basil.
      3. Butter slices of sourdough bread on the outside, layer sharp cheddar cheese inside.
      4. Toast in skillet on medium heat until golden brown on both sides and cheese is melted.
    ingredients:
      - name: "Canned Whole Tomatoes"
        quantity: 28
        unit: "oz"
        raw_text: "1 can (28 oz) whole peeled tomatoes"
        aisle_category: "Pantry & Grains"
      - name: "Heavy Cream"
        quantity: 0.5
        unit: "cup"
        raw_text: "1/2 cup heavy cream"
        aisle_category: "Dairy & Refrigerated"
      - name: "Sourdough Bread"
        quantity: 8
        unit: "slices"
        raw_text: "8 slices sourdough bread"
        aisle_category: "Bakery"
      - name: "Sharp Cheddar"
        quantity: 8
        unit: "oz"
        raw_text: "8 oz sharp cheddar cheese, sliced"
        aisle_category: "Dairy & Refrigerated"
      - name: "Vegetable Broth"
        quantity: 2
        unit: "cups"
        raw_text: "2 cups vegetable broth"
        aisle_category: "Pantry & Grains"

  - id: "sausage-peppers-potatoes"
    title: "Sheet Pan Sausage, Peppers & Crispy Potatoes"
    description: "Smoky kielbasa or Italian sausage roasted with baby potatoes and sweet bell peppers."
    prep_time: 10
    cook_time: 30
    servings: 4
    tags: ["One Pan", "Family Favorite", "Comfort Food"]
    image_url: "https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=800&q=80"
    instructions: |
      1. Preheat oven to 400°F (200°C).
      2. Halve baby potatoes. Toss with 1 tbsp olive oil, salt, and pepper on sheet pan and roast for 15 minutes.
      3. Add sliced sausage coins, sliced bell peppers, and red onion to the sheet pan.
      4. Toss everything together and roast another 15-20 minutes until potatoes are fork-tender and sausage is browned.
    ingredients:
