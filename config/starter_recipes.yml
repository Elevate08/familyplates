  - id: "slow-cooker-chili"
    title: "Hearty Beef & Bean Slow-Cooker Chili"
    description: "Classic rich chili simmered with ground beef, kidney beans, sweet corn, and warm chili spices."
    prep_time: 15
    cook_time: 240
    servings: 6
    tags: ["Slow Cooker", "Comfort Food", "Family Favorite"]
    image_url: "https://images.unsplash.com/photo-1541832676-9b763b0239ab?auto=format&fit=crop&w=800&q=80"
    instructions: |
      1. Brown ground beef and diced onion in a skillet. Drain grease and transfer to slow cooker.
      2. Add crushed tomatoes, drained kidney beans, black beans, corn, chili powder, cumin, and garlic.
      3. Stir well, cover, and cook on LOW for 4-6 hours (or HIGH for 2-3 hours).
      4. Serve hot with shredded cheddar cheese, green onions, and warm cornbread or tortilla chips.
    ingredients:
      - name: "Ground Beef"
        quantity: 1.5
        unit: "lbs"
        raw_text: "1.5 lbs ground beef"
        aisle_category: "Meat & Seafood"
      - name: "Kidney Beans"
        quantity: 1
        unit: "can"
        raw_text: "1 can (15 oz) red kidney beans, rinsed"
        aisle_category: "Pantry & Grains"
      - name: "Black Beans"
