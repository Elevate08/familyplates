starter_recipes:
  - id: "sheet-pan-fajitas"
    title: "Sheet Pan Chicken Fajitas"
    description: "Tender seasoned chicken strips, crisp bell peppers, and caramelized onions roasted on a single baking sheet."
    prep_time: 15
    cook_time: 20
    servings: 4
    tags: ["Quick (<30m)", "Family Favorite", "One Pan", "Mexican"]
    image_url: "https://images.unsplash.com/photo-1534352956036-cd81e27dd615?auto=format&fit=crop&w=800&q=80"
    instructions: |
      1. Preheat oven to 425°F (220°C).
      2. Slice chicken breast, bell peppers, and onion into thin strips.
      3. Place on large sheet pan, drizzle with olive oil, and toss with chili powder, cumin, garlic powder, salt, and black pepper.
      4. Spread in a single layer and roast for 20-25 minutes until chicken is cooked through and veggies are browned at edges.
      5. Squeeze fresh lime juice over top and serve warm with flour tortillas and salsa.
    ingredients:
      - name: "Chicken Breast"
        quantity: 1.5
        unit: "lbs"
        raw_text: "1.5 lbs boneless chicken breasts, sliced"
        aisle_category: "Meat & Seafood"
      - name: "Bell Peppers"
        quantity: 3
        unit: "count"
        raw_text: "3 bell peppers, mixed colors sliced"
        aisle_category: "Produce"
      - name: "Yellow Onion"
        quantity: 1
        unit: "count"
        raw_text: "1 medium yellow onion, sliced"
        aisle_category: "Produce"
      - name: "Flour Tortillas"
        quantity: 8
        unit: "count"
        raw_text: "8 medium flour tortillas"
        aisle_category: "Bakery"
      - name: "Limes"
        quantity: 2
