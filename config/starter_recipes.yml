        unit: "oz"
        raw_text: "14 oz smoked sausage or kielbasa, sliced into rounds"
        aisle_category: "Meat & Seafood"
      - name: "Baby Potatoes"
        quantity: 1.5
        unit: "lbs"
        raw_text: "1.5 lbs baby yellow potatoes, halved"
        aisle_category: "Produce"
      - name: "Bell Peppers"
        quantity: 2
        unit: "count"
        raw_text: "2 bell peppers, chopped into 1-inch chunks"
        aisle_category: "Produce"
      - name: "Red Onion"
        quantity: 1
        unit: "count"
        raw_text: "1 red onion, chopped into chunks"
        aisle_category: "Produce"

  - id: "greek-chicken-bowls"
    title: "Greek Lemon Herb Chicken & Rice Bowls"
    description: "Marinated grilled lemon-herb chicken over fluffy rice with diced cucumbers, tomatoes, feta, and tzatziki."
    prep_time: 15
    cook_time: 20
    servings: 4
    tags: ["Healthy", "Family Favorite", "Mediterranean"]
    image_url: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=800&q=80"
    instructions: |
      1. Cook jasmine or white rice.
      2. Toss chicken breast chunks with lemon juice, oregano, garlic powder, olive oil, salt, and pepper. Cook in skillet for 6-8 minutes until golden.
      3. Dice cucumber and cherry tomatoes; toss with a little olive oil and salt.
      4. Assemble bowls: warm rice base, grilled lemon chicken, diced cucumber/tomato salad, crumbled feta cheese, and a scoop of tzatziki sauce.
    ingredients:
